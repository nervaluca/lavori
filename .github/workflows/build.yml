name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icon and splash
        run: npx capacitor-assets generate --android

      # ── Plugin OCR (ML Kit) ──
      - name: Copia plugin OCR e MainActivity
        run: |
          SRC="android/app/src/main/java/it/iw1fzr/lavori"
          mkdir -p "$SRC/plugins"
          cp android-plugin/OcrPlugin.java "$SRC/plugins/"
          cp android-plugin/MainActivity.java "$SRC/MainActivity.java"

      - name: Aggiungi ML Kit e minSdk 23
        run: |
          printf "\ndependencies {\n    implementation 'com.google.mlkit:text-recognition:16.0.1'\n}\n" >> android/app/build.gradle
          sed -i -E 's/minSdkVersion = [0-9]+/minSdkVersion = 23/' android/variables.gradle
          grep -n "minSdkVersion" android/variables.gradle
          tail -4 android/app/build.gradle

      - name: Sync web assets
        run: npx cap sync android

      - name: Build release APK (unsigned)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign APK
        id: sign
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: lavori-apk
          path: ${{ steps.sign.outputs.signedReleaseFile }}
          if-no-files-found: error
